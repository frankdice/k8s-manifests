apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: audiobookshelf-kids
  namespace: flux-system
spec:
  values:
    image:
      repository: advplyr/audiobookshelf
      tag: 2.36.1
    service:
      ports:
        - 80
    #name is prepended with `<Chartname>-`
    storage: 
      - name: "audiobooks"
        mountPath: "/audiobooks"
        nfs:
          server: 192.168.1.35
          path: /Media/Kids/Audiobooks
      - name: "podcasts"
        mountPath: "/podcasts"
        nfs:
          server: 192.168.1.35
          path: /Media/Kids/Podcasts
      - name: "metadata"
        mountPath: "/metadata"
      - name: "config"
        mountPath: "/config"
    ingress:
      enabled: true
      hosts:
        - host: audiobookshelf-kids.babyvelociraptor.com
          paths:
            - path: /
              pathType: Prefix