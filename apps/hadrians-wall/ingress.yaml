kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: hadrians-wall
  namespace: hadrians-wall
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - hadrians-wall.${SECRET_DOMAIN}
      secretName: hadrians-wall-tls
  rules:
    - host: hadrians-wall.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hadrians-wall
                port:
                  name: web
