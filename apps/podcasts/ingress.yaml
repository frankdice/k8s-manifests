kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: podcasts
  namespace: podcasts
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - podcasts.${SECRET_DOMAIN}
      secretName: podcasts-tls
  rules:
    - host: podcasts.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podcasts
                port:
                  name: web
