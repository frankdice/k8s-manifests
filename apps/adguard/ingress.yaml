kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: adguard
  namespace: adguard
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - adguard.${SECRET_DOMAIN}
      secretName: adguard-tls
  rules:
    - host: adguard.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adguard
                port:
                  name: web
