kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: lidarr
  namespace: lidarr
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - lidarr.${SECRET_DOMAIN}
      secretName: lidarr-tls
  rules:
    - host: lidarr.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lidarr
                port:
                  name: web
