kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: kavita
  namespace: kavita
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - kavita.${SECRET_DOMAIN}
        - comics.${SECRET_DOMAIN}
      secretName: kavita-tls
  rules:
    - host: kavita.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kavita
                port:
                  name: web
    - host: comics.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kavita
                port:
                  name: web
