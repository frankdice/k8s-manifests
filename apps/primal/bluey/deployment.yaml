---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primal
spec:
  selector:
    matchLabels:
      app: primal
  template:
    metadata:
      labels:
        app: primal
    spec:
      containers:
      - image: docker.io/babyraptor/primal:sha-9a71762
        imagePullPolicy: IfNotPresent
        name: primal
        ports:
        - containerPort: 8501
          protocol: TCP
      restartPolicy: Always

