kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: primal
  namespace: primal
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - primal.${SECRET_DOMAIN}
      secretName: primal-tls
  rules:
    - host: primal.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: primal
                port:
                  name: web
