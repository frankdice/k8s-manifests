kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: sabnzbd
  namespace: sabnzbd
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - sabnzbd.${SECRET_DOMAIN}
      secretName: sabnzbd-tls
  rules:
    - host: sabnzbd.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sabnzbd
                port:
                  name: web
