kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: evan-dexcom-client
  namespace: evan-dexcom-client
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - evan-dexcom-client.${SECRET_DOMAIN}
      secretName: evan-dexcom-client-tls
  rules:
    - host: evan-dexcom-client.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: evan-dexcom-client
                port:
                  name: web
