apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: readarr
resources:
  - ../_base
components:
  - ../_components/pvc-longhorn
images:
  - name: app-image
    newName: linuxserver/readarr
    newTag: 0.3.10-develop
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          spec:
            containers:
              - name: ${APP_NAME}
                volumeMounts:
                  - name: downloads
                    mountPath: /downloads
                  - name: books
                    mountPath: /books
            volumes:
              - name: downloads
                nfs:
                  server: ${NAS_IP}
                  path: /Media/Downloads-Bluey
              - name: books
                nfs:
                  server: ${NAS_IP}
                  path: /Media/Books
