kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: sonarr
  namespace: sonarr
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - sonarr.${SECRET_DOMAIN}
      secretName: sonarr-tls
  rules:
    - host: sonarr.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  name: web
