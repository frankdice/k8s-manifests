apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
  namespace: flux-system
spec:
  releaseName: qdrant
  interval: 10m
  targetNamespace: qdrant
  chart:
    spec:
      chart: qdrant
      version: 1.16.3
      sourceRef:
        kind: HelmRepository
        name: qdrant
        namespace: flux-system
  values:
    ingress:
      enabled: true
      ingressClassName: haproxy-ingress
      annotations:
        cert-manager.io/cluster-issuer: cloudflare
      tls:
        - hosts:
            - qdrant.${SECRET_DOMAIN}
          secretName: qdrant-tls
      hosts:
        - host: qdrant.${SECRET_DOMAIN}
          paths:
            - path: /
              pathType: Prefix
              servicePort: 6333
