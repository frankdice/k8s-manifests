apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ignored
        annotations:
          cert-manager.io/cluster-issuer: cloudflare
      spec:
        tls:
          - hosts:
              - ${APP_NAME}.${SECRET_DOMAIN}
            secretName: ${APP_NAME}-tls
