kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: mylar
  namespace: mylar
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - mylar.${SECRET_DOMAIN}
      secretName: mylar-tls
  rules:
    - host: mylar.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mylar
                port:
                  name: web
