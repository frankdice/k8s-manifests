kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: bazarr
  namespace: bazarr
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - bazarr.${SECRET_DOMAIN}
      secretName: bazarr-tls
  rules:
    - host: bazarr.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bazarr
                port:
                  name: web
