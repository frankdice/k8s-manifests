kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: radarr
  namespace: radarr
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: haproxy-ingress
  tls:
    - hosts:
        - radarr.${SECRET_DOMAIN}
      secretName: radarr-tls
  rules:
    - host: radarr.${SECRET_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  name: web
