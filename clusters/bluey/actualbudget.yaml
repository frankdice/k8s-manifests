apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actualbudget
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: k8s-manifests
  path: ./apps/actualbudget
  prune: true
  postBuild:
    substitute:
      APP_NAME: actualbudget
      APP_PORT: "5006"
      INGRESS_CLASS: haproxy-ingress
      PVC_NAME: data
      PVC_MOUNT_PATH: /data
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
