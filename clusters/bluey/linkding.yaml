apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkding
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: k8s-manifests
  path: ./apps/linkding
  prune: true
  postBuild:
    substitute:
      APP_NAME: linkding
      APP_PORT: "9090"
      INGRESS_CLASS: haproxy-ingress
      PVC_NAME: data
      PVC_MOUNT_PATH: /etc/linkding/data
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
