apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m0s
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: k8s-manifests
  path: ./cluster-services/cert-manager
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
