apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  interval: 5m0s
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: k8s-manifests
  path: ./cluster-services/cluster-secrets
  prune: true
