apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: readarr
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: k8s-manifests
  path: ./apps/readarr
  prune: true
  postBuild:
    substitute:
      APP_NAME: readarr
      APP_PORT: "8787"
      PVC_NAME: config
      PVC_MOUNT_PATH: /config
      PVC_STORAGE_CLASS: local-path
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
