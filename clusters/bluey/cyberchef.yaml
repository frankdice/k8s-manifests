apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cyberchef
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: k8s-manifests
  path: ./apps/cyberchef
  prune: true
  postBuild:
    substitute:
      APP_NAME: cyberchef
      APP_PORT: "8000"
      INGRESS_CLASS: haproxy-ingress
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
