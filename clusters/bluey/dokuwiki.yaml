apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dokuwiki
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: k8s-manifests
  path: ./apps/dokuwiki
  prune: true
  postBuild:
    substitute:
      APP_NAME: dokuwiki
      APP_PORT: "80"
      INGRESS_CLASS: haproxy-ingress
      PVC_NAME: config
      PVC_MOUNT_PATH: /config
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
