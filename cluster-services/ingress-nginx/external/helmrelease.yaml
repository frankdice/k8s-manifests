apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-external
  namespace: flux-system
spec:
  targetNamespace: ingress-nginx-external
  interval: 5m
  chart:
    spec:
      chart: ingress-nginx
      version: 4.4.2
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    fullnameOverride: internal-ingress-nginx
    controller:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      config:
        use-forwarded-headers: "true"
        compute-full-forwarded-for: "true"
        enable-real-ip: "true"
      ingressClassResource:
        name: nginx-external
        controllerValue: k8s.io/ingress-nginx-external
      ingressClass: nginx-external
      service:
        externalTrafficPolicy: Local
        ports:
          http: 8080
          https: 8443
