apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.16.1
          args:
            - --source=service
            - --source=ingress
            - --registry=txt
            - --provider=cloudflare
            - --domain-filter=${SECRET_DOMAIN}
            - --txt-owner-id=bluey
            - --annotation-filter=nginx.ingress.kubernetes.io/auth-method notin (GET)
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-key
                  key: CF_API_TOKEN
                  optional: false
